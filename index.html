<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Juice Maker App</title>
    <style>
      body {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        max-width: 800px;
        margin: 0 auto;
        padding: 20px;
        background-color: #f8f9fa;
      }
      h1 {
        color: #e67e22;
        text-align: center;
      }
      .container {
        background-color: white;
        border-radius: 10px;
        padding: 20px;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
      }
      .step {
        margin-bottom: 20px;
        padding: 15px;
        border-radius: 5px;
        background-color: #f9f3e6;
      }
      .ingredients-list {
        margin-top: 15px;
      }
      .ingredient-item {
        display: flex;
        align-items: center;
        margin-bottom: 10px;
        padding: 10px;
        background-color: #f5f5f5;
        border-radius: 5px;
      }
      .ingredient-item span {
        margin-right: 10px;
      }
      .delete-btn {
        background-color: #e74c3c;
        color: white;
        border: none;
        border-radius: 3px;
        padding: 3px 8px;
        cursor: pointer;
        margin-left: auto;
      }
      input,
      select,
      button {
        padding: 8px;
        margin: 5px;
        border: 1px solid #ddd;
        border-radius: 5px;
      }
      button {
        background-color: #e67e22;
        color: white;
        border: none;
        cursor: pointer;
        padding: 10px 15px;
      }
      button:hover {
        background-color: #d35400;
      }
      .result {
        margin-top: 20px;
        padding: 15px;
        background-color: #e8f5e9;
        border-radius: 5px;
        display: none;
      }
      .juices-list {
        margin-top: 20px;
      }
      .juice-item {
        padding: 15px;
        margin-bottom: 10px;
        background-color: #e8f5e9;
        border-radius: 5px;
        cursor: pointer;
      }
      .error {
        color: #e74c3c;
        font-size: 0.9em;
        margin-top: 5px;
      }
    </style>
  </head>
  <body>
    <h1>🍹 Juice Maker App 🍹</h1>

    <div class="container">
      <div class="step">
        <h2>Step 1: Name Your Juice</h2>
        <input type="text" id="juice-name" placeholder="Enter juice name..." />
        <span id="name-error" class="error"></span>
      </div>

      <div class="step">
        <h2>Step 2: Add Ingredients</h2>
        <div>
          <input
            type="text"
            id="ingredient-name"
            placeholder="Ingredient name"
          />
          <label for="ingredient-quantity">Quantity:</label>
          <input
            type="number"
            id="ingredient-quantity"
            min="1"
            value="1"
            title="Enter the quantity of the ingredient"
            placeholder="Quantity"
          />
          <select id="ingredient-unit">
            <option value="whole">Whole</option>
            <option value="cup">Cup</option>
            <option value="tablespoon">Tablespoon</option>
            <option value="teaspoon">Teaspoon</option>
            <option value="piece">Piece</option>
            <option value="slice">Slice</option>
          </select>
          <button id="add-ingredient">Add</button>
        </div>
        <span id="ingredient-error" class="error"></span>

        <div class="ingredients-list" id="ingredients-list">
          <!-- Ingredients will be added here -->
        </div>
      </div>

      <div class="step">
        <h2>Step 3: Make Your Juice</h2>
        <button id="make-juice">Make Juice</button>
      </div>

      <div class="result" id="result">
        <h2>Your Juice is Ready!</h2>
        <p id="juice-description"></p>
      </div>

      <div class="juices-list" id="juices-list">
        <h2>Your Juice Recipes</h2>
        <!-- Saved juices will be listed here -->
      </div>
    </div>

    <script>
      const juiceStore = [];

      const juiceNameInput = document.getElementById("juice-name");
      const ingredientNameInput = document.getElementById("ingredient-name");
      const ingredientQuantityInput = document.getElementById(
        "ingredient-quantity"
      );
      const ingredientUnitInput = document.getElementById("ingredient-unit");
      const addIngredientBtn = document.getElementById("add-ingredient");
      const ingredientsList = document.getElementById("ingredients-list");
      const makeJuiceBtn = document.getElementById("make-juice");
      const resultDiv = document.getElementById("result");
      const juiceDescriptionP = document.getElementById("juice-description");
      const juicesList = document.getElementById("juices-list");
      const nameError = document.getElementById("name-error");
      const ingredientError = document.getElementById("ingredient-error");

      let currentIngredients = [];

      const juiceMaker = (juiceName, ingredients) => {
        const newJuice = {
          name: juiceName,
          ingredients: ingredients,
          createdAt: new Date().toISOString(),
          id: `juice-${Date.now()}`,
        };

        juiceStore.push(newJuice);

        let description = `${juiceName} contains: `;
        ingredients.forEach((item, index) => {
          description += `${item.quantity} ${item.unit} of ${item.name}`;
          if (index < ingredients.length - 1) {
            description += ", ";
          }
        });

        return {
          success: true,
          juice: newJuice,
          description: description,
        };
      };

      addIngredientBtn.addEventListener("click", () => {
        const name = ingredientNameInput.value.trim();
        const quantity = parseInt(ingredientQuantityInput.value);
        const unit = ingredientUnitInput.value;

        if (!name) {
          ingredientError.textContent = "Please enter an ingredient name";
          return;
        }

        ingredientError.textContent = "";

        currentIngredients.push({ name, quantity, unit });

        const ingredientItem = document.createElement("div");
        ingredientItem.className = "ingredient-item";
        ingredientItem.innerHTML = `
                <span>${quantity} ${unit} of ${name}</span>
                <button class="delete-btn" data-index="${
                  currentIngredients.length - 1
                }">✕</button>
            `;
        ingredientsList.appendChild(ingredientItem);

        ingredientNameInput.value = "";
        ingredientQuantityInput.value = 1;
        ingredientUnitInput.value = "whole";
      });

      ingredientsList.addEventListener("click", (e) => {
        if (e.target.classList.contains("delete-btn")) {
          const index = parseInt(e.target.getAttribute("data-index"));
          currentIngredients.splice(index, 1);
          renderIngredientsList();
        }
      });

      const renderIngredientsList = () => {
        ingredientsList.innerHTML = "";
        currentIngredients.forEach((ingredient, index) => {
          const ingredientItem = document.createElement("div");
          ingredientItem.className = "ingredient-item";
          ingredientItem.innerHTML = `
                    <span>${ingredient.quantity} ${ingredient.unit} of ${ingredient.name}</span>
                    <button class="delete-btn" data-index="${index}">✕</button>
                `;
          ingredientsList.appendChild(ingredientItem);
        });
      };

      makeJuiceBtn.addEventListener("click", () => {
        const juiceName = juiceNameInput.value.trim();

        if (!juiceName) {
          nameError.textContent = "Please enter a juice name";
          return;
        }

        if (currentIngredients.length === 0) {
          ingredientError.textContent = "Please add at least one ingredient";
          return;
        }

        nameError.textContent = "";
        ingredientError.textContent = "";

        const juiceResult = juiceMaker(juiceName, [...currentIngredients]);

        juiceDescriptionP.textContent = juiceResult.description;
        resultDiv.style.display = "block";

        const juiceItem = document.createElement("div");
        juiceItem.className = "juice-item";
        juiceItem.textContent = juiceResult.description;
        juicesList.appendChild(juiceItem);

        juiceNameInput.value = "";
        currentIngredients = [];
        renderIngredientsList();
      });
    </script>
  </body>
</html>
